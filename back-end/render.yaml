services:
  - type: web
    name: streamify_api
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: streamify.vercel.app
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DERIV_FIELD_ENCRYPTION_KEY
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DATABASE_URL
        sync: false
